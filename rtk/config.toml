[tracking]
enabled = true
history_days = 90

[display]
colors = true
emoji = true
max_width = 120

[filters]
ignore_dirs = [
    ".git",
    "node_modules",
    "target",
    "__pycache__",
    ".venv",
    "vendor",
]
ignore_files = [
    "*.lock",
    "*.min.js",
    "*.min.css",
]

[retriever]
mode = "sqlite"
tee_max_files = 20
tee_max_file_size = 1048576

[telemetry]
enabled = false
consent_given = false
consent_date = "2026-09-08T05:48:55.522253099+00:00"

[hooks]
exclude_commands = []
transparent_prefixes = []

[limits]
grep_max_results = 200
grep_max_per_file = 25
status_max_files = 15
status_max_untracked = 10
passthrough_max_chars = 2000
